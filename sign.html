<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-EeTZtfNvd0eVOVTpP8IxMu+fcGa/p39zoDMtP4BW+VE='; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; worker-src blob: https://cdnjs.cloudflare.com; img-src blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>공사 계약서 서명</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#f5f5f5;color:#182535}h2{margin:6px 0 10px;font-size:20px}
.box{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:12px}
#pdfbox{max-height:70vh;overflow:auto;border:1px solid #ccc;background:#888;padding:6px}
#pdfbox canvas{display:block;width:100%;height:auto;margin:0 auto 6px;background:#fff}
label{display:block;margin:10px 0 4px;font-weight:bold}
input[type=text]{width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:6px}
#cv{width:100%;height:180px;border:1px dashed #888;background:#fff;touch-action:none;display:block}
button{padding:12px 18px;font-size:16px;border:0;border-radius:6px;cursor:pointer;min-height:44px}
.ok{background:#1a73e8;color:#fff}.ok:disabled{opacity:.5}.sub{background:#e8eaed;color:#182535;margin-top:6px}
.err{color:#b00020;font-weight:bold}#msg{display:block;margin-top:10px;font-weight:bold}
#warn{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:9}
#warn>div{background:#fff;padding:22px 26px;border-radius:10px;max-width:90%;text-align:center}
#warn p{color:#b00020;font-weight:bold;font-size:17px;margin:0 0 14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="warn"><div><p></p><button class="ok" type="button" id="warnok">확인</button></div></div>
<h2>공사 계약서 서명</h2>
<div id="status" class="box">서명 페이지를 불러오는 중입니다…</div>
<div id="main" hidden>
  <div class="box"><b>고객명</b> <span id="i1"></span> &nbsp; <b>공사명</b> <span id="i2"></span> &nbsp; <b>총 공사계약금액</b> <span id="i3"></span>원</div>
  <div class="box"><div id="pdfbox"></div><p style="font-size:13px;color:#555" id="pdfmsg">계약서를 불러오는 중입니다...</p></div>
  <div class="box">
    <label for="nm">성명</label><input type="text" id="nm" maxlength="30" autocomplete="name">
    <label for="idno">생년월일 6자리 또는 사업자번호 10자리 <span style="font-weight:normal;color:#777">(숫자만, 예: 900101 / 1234567890)</span></label>
    <input type="text" id="idno" maxlength="10" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <label>서명</label><canvas id="cv"></canvas>
    <button type="button" class="sub" id="clr">지우기</button>
    <p><label style="display:inline;font-weight:normal"><input type="checkbox" id="ag"> 계약서 내용(공사 기간·금액·지불 조건·특약)을 확인했으며 이에 동의합니다.</label></p>
    <button class="ok" id="btn" type="button">서명 제출</button>
    <span id="msg" role="status" aria-live="polite"></span>
  </div>
</div>
<script>
'use strict';
const API_BASE = 'https://script.google.com/macros/s/AKfycbzjUkKplwcu4a5yfK8Q_TQj4oTLErFE4DbeqwHAxl_WVWMTUWNZCy44rh2Mu-w82tQ/exec';
const PDF_JS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ERR = '서명 페이지를 준비할 수 없습니다. 담당자에게 문의해 주세요.';
const $ = id => document.getElementById(id);
let token = '';
function fail(text) { $('main').hidden = true; const s = $('status'); s.hidden = false; s.className = 'box err'; s.textContent = text || ERR; }
function warn(t) { const w = $('warn'); w.querySelector('p').textContent = t; w.style.display = 'flex'; }
$('warn').addEventListener('click', () => { $('warn').style.display = 'none'; });
function loadPdfJs() {
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = PDF_JS; s.referrerPolicy = 'no-referrer'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
// 고객 열람 확인(서버가 viewRead 를 줄 때만 동작). 첫 쪽 표시 + 화면 보임 + 손님 조작 후 1회만 알림. 실패해도 문서·서명에 영향 없음
function viewReadInstall(cfg, tok) {
  if (!cfg || typeof cfg.ticket !== 'string' || !cfg.ticket) return { rendered() {} };
  let sent = false, rendered = false, touched = false;
  const bot = /bot|crawler|spider|preview|facebookexternalhit|kakaotalk-scrap/i.test(navigator.userAgent || '');
  const send = () => {
    if (sent || bot || !rendered || !touched || document.visibilityState !== 'visible') return;
    sent = true;
    try { fetch(API_BASE, { method: 'POST', body: JSON.stringify({ a: 'viewread', token: tok, ticket: cfg.ticket, rendered: true, visible: true, interacted: true, bot: false }), keepalive: true, credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' }).catch(() => {}); } catch (_) {}
  };
  const touch = e => { if (e.isTrusted) { touched = true; send(); } };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(k => document.addEventListener(k, touch, { passive: true }));
  document.addEventListener('visibilitychange', send);
  return { rendered() { rendered = true; send(); } };
}
async function showPdf(b64, viewRead) {
  const msg = $('pdfmsg');
  try {
    const bin = atob(b64); const arr = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    if (String.fromCharCode(...arr.subarray(0, 5)) !== '%PDF-') throw new Error();
    await loadPdfJs();
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
    const doc = await pdfjsLib.getDocument({ data: arr, isEvalSupported: false, useSystemFonts: true, disableFontFace: true }).promise;
    msg.textContent = '계약서 ' + doc.numPages + '쪽 — 아래로 넘기며 확인해 주세요.';
    const box = $('pdfbox');
    for (let n = 1; n <= doc.numPages; n++) {
      const p = await doc.getPage(n); const base = p.getViewport({ scale: 1 });
      const scale = Math.min(4, Math.max(3, (window.devicePixelRatio || 1) * box.clientWidth / base.width));
      const vp = p.getViewport({ scale }); const c = document.createElement('canvas');
      c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height); box.appendChild(c);
      await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; p.cleanup();
      if (n === 1 && viewRead) viewRead.rendered();
    }
  } catch (_) { msg.textContent = '계약서를 표시할 수 없습니다. 담당자에게 PDF 파일을 요청해 주세요.'; }
}
// 서명판
const cv = $('cv'), ctx = cv.getContext('2d'); let drawing = false, drawn = false;
function fit() { const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(2, 2); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; drawn = false; }
function pos(e) { const r = cv.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return [p.clientX - r.left, p.clientY - r.top]; }
function dn(e) { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); e.preventDefault(); }
function mv(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); drawn = true; e.preventDefault(); }
function up() { drawing = false; }
cv.addEventListener('mousedown', dn); cv.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
cv.addEventListener('touchstart', dn, { passive: false }); cv.addEventListener('touchmove', mv, { passive: false }); cv.addEventListener('touchend', up);
$('clr').addEventListener('click', fit);
async function send() {
  const m = $('msg'), btn = $('btn');
  const name = $('nm').value.trim(), idno = $('idno').value;
  if (!drawn) { m.textContent = '서명을 그려 주세요.'; return; }
  if (!name || name.length > 30) { m.textContent = '성명을 확인해 주세요.'; return; }
  if (!/^([0-9]{6}|[0-9]{10})$/.test(idno)) { m.textContent = '잘못된 형식의 생년월일(사업자번호) 입니다 !'; warn('잘못된 형식의 생년월일(사업자번호) 입니다 !'); return; }
  if ($('ag').checked !== true) { m.textContent = '계약 내용 확인에 동의해 주세요.'; return; }
  btn.disabled = true; m.textContent = '저장 중...';
  try {
    const body = new URLSearchParams({ a: 'sign', t: token, name: name, idno: idno, png: cv.toDataURL('image/png'), agreed: 'true' });
    const res = await fetch(API_BASE, { method: 'POST', body: body, redirect: 'follow', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' });
    const r = await res.json();
    m.textContent = (r && typeof r.msg === 'string') ? r.msg : '저장 결과를 확인해 주세요.';
    if (!r || r.ok !== true) btn.disabled = false;
    else {
      $('nm').disabled = true; $('idno').disabled = true; $('ag').disabled = true; $('clr').disabled = true; cv.style.pointerEvents = 'none';
      // 서명 저장 후 서명본 계약서 만들기를 따로 요청(고객은 기다리지 않음, 실패해도 서버 점검이 다시 함)
      fetch(API_BASE, { method: 'POST', body: new URLSearchParams({ a: 'kick', t: token }), keepalive: true, credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' }).catch(() => {});
    }
  } catch (_) {
    // 응답을 못 받으면 자동으로 다시 보내지 않음(중복 방지). 저장 여부는 담당자가 확인
    m.textContent = '저장 결과를 확인할 수 없습니다. 담당자에게 문의해 주세요.';
    btn.disabled = false;
  }
}
$('btn').addEventListener('click', send);
async function start() {
  const vals = new URLSearchParams(location.search).getAll('s');
  if (vals.length !== 1 || !/^[a-f0-9]{64}$/.test(vals[0])) { fail(); return; }
  token = vals[0];
  try {
    const res = await fetch(API_BASE + '?f=json&s=' + token, { redirect: 'follow', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' });
    const d = await res.json();
    if (!d || d.ok !== true) { fail(d && typeof d.msg === 'string' ? d.msg : ERR); return; }
    $('i1').textContent = d.info.고객명; $('i2').textContent = d.info.공사명; $('i3').textContent = d.info.총액;
    $('status').hidden = true; $('main').hidden = false; fit();
    showPdf(d.b64, viewReadInstall(d.viewRead, token));
  } catch (_) { fail(); }
}
start();
</script>
</body>
</html>
