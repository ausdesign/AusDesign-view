<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-p6yKdXWi/g986Kg6lpOiOHd6ZQ3roUnPRfhI/gWfjlg='; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; worker-src blob: https://cdnjs.cloudflare.com; img-src blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>문서 열람</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#182535;font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(16px,env(safe-area-inset-right));background:#fff;border-bottom:1px solid #d9e0e7}h1{font-size:18px;margin:0;overflow-wrap:anywhere}button{flex-shrink:0;min-height:44px;padding:10px 18px;border:0;border-radius:8px;background:#244b68;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #e59b29;outline-offset:3px}main{max-width:1000px;margin:auto;padding:20px 12px 40px}#status{padding:36px 14px;text-align:center;line-height:1.8;overflow-wrap:anywhere}.sheet{margin:0 auto 20px;max-width:100%}.sheet canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 12px #18253518}.sheet figcaption{text-align:center;font-size:12px;color:#536578;padding:8px}[hidden]{display:none!important}@media(max-width:480px){header{padding:12px}h1{font-size:16px}main{padding:14px 8px 28px}button{padding:10px 14px}}
</style>
</head>
<body>
<header><h1 id="title">문서 열람</h1><button id="save" type="button" disabled>PDF 저장</button></header>
<main><p id="status" role="status" aria-live="polite">문서를 불러오는 중입니다…</p><!-- 견적특이사항은 견적 PDF에 포함된 그대로 표시합니다. 계약 특약을 견적에 덧붙이지 않습니다. -->
<div id="pages" aria-label="PDF 문서"></div></main>
<script>
'use strict';
// CM이 이 한 곳에만 서버 주소를 설정합니다.
const API_BASE = 'https://script.google.com/macros/s/AKfycbzjUkKplwcu4a5yfK8Q_TQj4oTLErFE4DbeqwHAxl_WVWMTUWNZCy44rh2Mu-w82tQ/exec';
const PDF_JS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ERROR_TEXT = '문서를 열 수 없습니다. 링크가 만료되었거나 잘못되었습니다. 담당자에게 문의해 주세요.';
const titleElement = document.getElementById('title');
const statusElement = document.getElementById('status');
const pagesElement = document.getElementById('pages');
const saveButton = document.getElementById('save');
let pdfBytes = null;
let documentTitle = '';
let documentTask = null;
function showError() {
  saveButton.disabled = true;
  pdfBytes = null;
  pagesElement.replaceChildren();
  titleElement.textContent = '문서 열람';
  statusElement.textContent = ERROR_TEXT;
  statusElement.hidden = false;
  if (documentTask) { documentTask.destroy().catch(() => {}); documentTask = null; }
}
function loadPdfJs() {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = PDF_JS;
    script.referrerPolicy = 'no-referrer';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
saveButton.addEventListener('click', () => {
  if (!pdfBytes) return;
  if (/KAKAOTALK/i.test(navigator.userAgent)) {
    window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(window.location.href);
    return;
  }
  const url = URL.createObjectURL(new Blob([pdfBytes], {type: 'application/pdf'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = documentTitle + '.pdf';
  link.rel = 'noreferrer';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});
// 고객 열람 확인(서버가 viewRead 를 줄 때만 동작). 첫 쪽 표시 + 화면 보임 + 손님 조작 후 1회만 알림. 실패해도 문서·서명에 영향 없음
function viewReadInstall(cfg, tok) {
  if (!cfg || typeof cfg.ticket !== 'string' || !cfg.ticket) return { rendered() {} };
  let sent = false, rendered = false, touched = false;
  const bot = /bot|crawler|spider|preview|facebookexternalhit|kakaotalk-scrap/i.test(navigator.userAgent || '');
  const send = () => {
    if (sent || bot || !rendered || !touched || document.visibilityState !== 'visible') return;
    sent = true;
    try { fetch(API_BASE, { method: 'POST', body: JSON.stringify({ a: 'viewread', token: tok, ticket: cfg.ticket, rendered: true, visible: true, interacted: true, bot: false }), keepalive: true, credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' }).catch(() => {}); } catch (_) {}
  };
  const touch = e => { if (e.isTrusted) { touched = true; send(); } };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(k => document.addEventListener(k, touch, { passive: true }));
  document.addEventListener('visibilitychange', send);
  return { rendered() { rendered = true; send(); } };
}
async function openDocument() {
  const values = new URLSearchParams(window.location.search).getAll('v');
  if (values.length !== 1 || !/^[a-f0-9]{64}$/.test(values[0])) { showError(); return; }
  const abort = new AbortController();
  const timeout = setTimeout(() => abort.abort(), 45000);
  try {
    const api = new URL(API_BASE);
    if (api.protocol !== 'https:' || api.hostname !== 'script.google.com' || !/^\/macros\/s\/[^/]+\/exec$/.test(api.pathname) || api.search || api.hash || api.username || api.password) throw new Error();
    const response = await fetch(API_BASE + '?f=json&v=' + values[0], {
      signal: abort.signal, redirect: 'follow', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer'
    });
    if (!response.ok) throw new Error();
    const data = await response.json();
    if (data.ok !== true || !['공사 견적서', '공사 계약서', '급여명세서'].includes(data.title) || typeof data.b64 !== 'string' || !data.b64 || data.b64.length > 30000000) throw new Error();
    const binary = atob(data.b64);
    const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
    if (String.fromCharCode(...bytes.subarray(0, 5)) !== '%PDF-') throw new Error();
    clearTimeout(timeout);
    const viewRead = viewReadInstall(data.viewRead, values[0]);
    await loadPdfJs();
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
    // PDF 내 외부 링크·스크립트·폰트 네트워크 로딩을 사용하지 않습니다.
    documentTask = pdfjsLib.getDocument({data: bytes.slice(), isEvalSupported: false, useSystemFonts: true, disableFontFace: true});
    const pdf = await documentTask.promise;
    documentTitle = data.title;
    titleElement.textContent = documentTitle;
    document.title = documentTitle;
    for (let number = 1; number <= pdf.numPages; number++) {
      statusElement.textContent = '문서를 불러오는 중입니다… (' + number + '/' + pdf.numPages + ')';
      const page = await pdf.getPage(number);
      const base = page.getViewport({scale: 1});
      const width = Math.min(pagesElement.clientWidth, 976);
      // 휴대폰에서도 글자가 선명하도록 최소 3배(PDF 기준)로 그리고 화면 폭에 맞춰 줄여 보여 줌
      const scale = Math.min(4, Math.max(3, (window.devicePixelRatio || 1) * width / base.width));
      const viewport = page.getViewport({scale});
      const figure = document.createElement('figure');
      figure.className = 'sheet';
      figure.style.width = Math.min(width, base.width * 1.5) + 'px';
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', documentTitle + ' ' + number + '쪽');
      const caption = document.createElement('figcaption');
      caption.textContent = number + ' / ' + pdf.numPages;
      figure.append(canvas, caption);
      pagesElement.appendChild(figure);
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      page.cleanup();
      if (number === 1) viewRead.rendered();
    }
    pdfBytes = bytes;
    saveButton.disabled = false;
    statusElement.hidden = true;
  } catch (_) { showError(); }
  finally { clearTimeout(timeout); }
}
openDocument();
</script>
</body>
</html>
